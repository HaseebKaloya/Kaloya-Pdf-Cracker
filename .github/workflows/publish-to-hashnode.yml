name: Publish to Hashnode

on:
  push:
    branches:
      - main
    paths:
      - 'articles/**/*.md'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Publish to Hashnode via GraphQL
        run: node .github/scripts/publish-hashnode.js
        env:
          HASHNODE_PAT: ${{ secrets.HASHNODE_PERSONAL_ACCESS_TOKEN }}
          HASHNODE_PUBLICATION_ID: ${{ secrets.HASHNODE_PUBLICATION_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
